<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Protein">
<meta name="theme-color" content="#F2F2F7">
<title>Protein</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2F2F7;
    --card: #FFFFFF;
    --text: #1C1C1E;
    --muted: #8E8E93;
    --red: #FF3B30;
    --amber: #FF9F0A;
    --green: #34C759;
    --sgreen: #009955;
    --shadow: 0 4px 24px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
    --radius: 20px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
  }
  body { padding: calc(16px + var(--safe-t)) 16px calc(40px + var(--safe-b)); max-width: 430px; margin: 0 auto; }
  button { font: inherit; border: none; background: none; cursor: pointer; color: inherit; }
  input { font: inherit; color: inherit; }

  .header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; gap: 12px; }
  .header-left { flex: 1; min-width: 0; }
  .date-row { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
  .date-label {
    font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted);
  }
  .chev {
    width: 28px; height: 28px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 18px; line-height: 1; font-weight: 600;
  }
  .chev:active { background: rgba(0,0,0,0.06); }
  .title { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; margin: 0; line-height: 1.1; }
  .header-actions { display: flex; gap: 8px; padding-top: 4px; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--card); box-shadow: var(--shadow);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 500; color: var(--text);
    position: relative;
  }
  .icon-btn.plus { background: var(--text); color: #fff; font-size: 26px; line-height: 1; }
  .icon-btn:active { transform: scale(0.94); }

  .menu {
    position: absolute; top: 48px; right: 0; z-index: 50;
    background: var(--card); border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,0.18);
    min-width: 180px; padding: 6px; display: none;
  }
  .menu.open { display: block; }
  .menu button {
    display: block; width: 100%; text-align: left;
    padding: 12px 14px; border-radius: 10px; font-size: 15px; font-weight: 500;
  }
  .menu button:active { background: var(--bg); }
  .menu button.danger { color: var(--red); }

  .card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 20px; margin-bottom: 14px;
  }

  .gauge-wrap { position: relative; width: 100%; max-width: 320px; margin: 0 auto 4px; }
  .gauge-wrap svg { width: 100%; height: auto; display: block; }
  .gauge-center {
    position: absolute; left: 0; right: 0; top: 58%;
    transform: translateY(-50%);
    text-align: center; pointer-events: none;
  }
  .gauge-kicker {
    font-size: 11px; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 2px;
  }
  .gauge-total {
    font-size: 56px; font-weight: 700; letter-spacing: -0.04em;
    line-height: 1; margin: 0;
  }
  .status-pill {
    display: inline-block; margin-top: 8px;
    padding: 4px 12px; border-radius: 999px;
    font-size: 13px; font-weight: 600; color: #fff;
  }
  .gauge-hint { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .band-label { font-size: 10px; font-weight: 600; fill: #8E8E93; }

  .week-title {
    font-size: 13px; font-weight: 600; color: var(--muted);
    letter-spacing: 0.04em; text-transform: uppercase; margin: 0 0 14px;
  }
  .week-row { display: flex; justify-content: space-between; gap: 4px; }
  .week-day { flex: 1; text-align: center; }
  .week-dot {
    width: 14px; height: 14px; border-radius: 50%;
    margin: 0 auto 6px; background: transparent;
    border: 2px solid #D1D1D6;
  }
  .week-dot.filled { border-width: 0; }
  .week-dot.viewed { box-shadow: 0 0 0 3px rgba(0,0,0,0.14); }
  .week-initial { font-size: 11px; font-weight: 600; color: var(--muted); }

  .log-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 8px; flex-wrap: wrap; }
  .log-title { font-size: 17px; font-weight: 700; margin: 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; font-size: 10px; color: var(--muted); font-weight: 500; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  .log-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0; border-top: 1px solid #F2F2F7;
    cursor: pointer;
  }
  .log-row:first-of-type { border-top: none; }
  .log-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .log-main { flex: 1; min-width: 0; }
  .log-name { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .log-time { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .power-pill {
    display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 0.06em;
    background: var(--sgreen); color: #fff; padding: 2px 6px; border-radius: 999px;
  }
  .log-bar-wrap { width: 72px; height: 4px; background: #F2F2F7; border-radius: 2px; overflow: hidden; flex-shrink: 0; }
  .log-bar { height: 100%; border-radius: 2px; }
  .log-grams { font-size: 16px; font-weight: 700; width: 42px; text-align: right; flex-shrink: 0; }
  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 20px 0; }

  .photos-title { font-size: 17px; font-weight: 700; margin: 0 0 4px; }
  .photos-hint { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
  .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* Flip cards */
  .flip-scene {
    perspective: 1200px;
    -webkit-perspective: 1200px;
    aspect-ratio: 3 / 4;
    cursor: pointer;
  }
  .flip-card {
    position: relative; width: 100%; height: 100%;
    transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
  }
  .flip-card.flipped { transform: rotateY(180deg); -webkit-transform: rotateY(180deg); }
  .flip-face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 16px; overflow: hidden;
    background: #E5E5EA;
  }
  .flip-front img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-cap {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 28px 10px 10px;
    background: linear-gradient(transparent, rgba(0,0,0,0.65));
    color: #fff; font-size: 12px; font-weight: 600;
  }
  .photo-cap .g { font-weight: 700; }
  .photo-cap .t { opacity: 0.85; font-weight: 500; font-size: 11px; }
  .flip-hint {
    position: absolute; top: 8px; right: 8px;
    background: rgba(0,0,0,0.45); color: #fff;
    font-size: 10px; font-weight: 600; padding: 3px 7px; border-radius: 999px;
  }
  .flip-back {
    transform: rotateY(180deg); -webkit-transform: rotateY(180deg);
    background: #1C1C1E; color: #fff;
    padding: 10px; display: flex; flex-direction: column; gap: 6px;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .back-title { font-size: 12px; font-weight: 700; line-height: 1.2; margin: 0; }
  .back-sub { font-size: 9px; color: rgba(255,255,255,0.55); margin: 0; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .stat-tile {
    background: rgba(255,255,255,0.1); border-radius: 9px;
    padding: 6px 6px 5px; text-align: center;
  }
  .stat-tile .v { font-size: 14px; font-weight: 700; letter-spacing: -0.02em; }
  .stat-tile .l { font-size: 8px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: rgba(255,255,255,0.55); margin-top: 1px; }
  .macro-bar {
    display: flex; height: 5px; border-radius: 3px; overflow: hidden;
    background: rgba(255,255,255,0.12); flex-shrink: 0;
  }
  .macro-bar span { display: block; height: 100%; }
  .macro-legend {
    display: flex; justify-content: space-between; gap: 4px;
    font-size: 8px; color: rgba(255,255,255,0.6); font-weight: 600;
  }
  .macro-legend i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 3px; vertical-align: middle; }
  .insight {
    font-size: 10px; line-height: 1.3; color: rgba(255,255,255,0.85);
    padding-left: 7px; border-left: 2px solid var(--green);
  }
  .back-empty { font-size: 11px; color: rgba(255,255,255,0.6); margin-top: auto; }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.35);
    z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 110;
    background: var(--card);
    border-radius: 24px 24px 0 0;
    padding: 12px 20px calc(24px + var(--safe-b));
    max-width: 430px; margin: 0 auto;
    transform: translateY(110%); transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
    max-height: 92vh; overflow-y: auto;
  }
  .sheet.open { transform: translateY(0); }
  .sheet-handle { width: 36px; height: 5px; background: #D1D1D6; border-radius: 3px; margin: 0 auto 16px; }
  .sheet-title { font-size: 20px; font-weight: 700; margin: 0 0 16px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
  .field input {
    width: 100%; padding: 14px 14px; border-radius: 12px;
    border: 1px solid #E5E5EA; background: var(--bg); font-size: 16px;
    outline: none;
  }
  .field input:focus { border-color: #007AFF; background: #fff; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .photo-pick { display: flex; align-items: center; gap: 12px; }
  .photo-preview {
    width: 64px; height: 64px; border-radius: 12px; object-fit: cover;
    background: var(--bg); display: none;
  }
  .photo-preview.show { display: block; }
  .pick-btn {
    flex: 1; padding: 14px; border-radius: 12px; background: var(--bg);
    font-size: 15px; font-weight: 600; text-align: center; color: #007AFF;
  }
  .sheet-actions { display: flex; gap: 10px; margin-top: 8px; }
  .btn {
    flex: 1; padding: 16px; border-radius: 14px;
    font-size: 16px; font-weight: 600; text-align: center;
  }
  .btn-primary { background: var(--text); color: #fff; }
  .btn-secondary { background: var(--bg); color: var(--text); }
  .btn-danger { background: #FFE5E5; color: var(--red); }
  .btn:active { opacity: 0.85; }
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--muted); margin: 8px 0 10px;
  }

  #fileInput, #importInput { display: none; }
</style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <div class="date-row">
        <button class="chev" id="prevDay" aria-label="Previous day">‹</button>
        <span class="date-label" id="dateLabel">—</span>
        <button class="chev" id="nextDay" aria-label="Next day">›</button>
      </div>
      <h1 class="title">Protein</h1>
    </div>
    <div class="header-actions">
      <div style="position:relative">
        <button class="icon-btn" id="menuBtn" aria-label="Menu">⋯</button>
        <div class="menu" id="menu">
          <button type="button" id="exportBtn">Export JSON</button>
          <button type="button" id="importBtn">Import JSON</button>
          <button type="button" class="danger" id="clearDayBtn">Clear day</button>
        </div>
      </div>
      <button class="icon-btn plus" id="addBtn" aria-label="Add">+</button>
    </div>
  </header>

  <section class="card" id="gaugeCard">
    <div class="gauge-wrap">
      <svg id="gaugeSvg" viewBox="0 0 320 240" aria-hidden="true"></svg>
      <div class="gauge-center">
        <div class="gauge-kicker">Today's protein</div>
        <p class="gauge-total" id="totalNum">0</p>
        <span class="status-pill" id="statusPill">Low</span>
        <div class="gauge-hint" id="gaugeHint">—</div>
      </div>
    </div>
  </section>

  <section class="card">
    <h2 class="week-title">This week</h2>
    <div class="week-row" id="weekRow"></div>
  </section>

  <section class="card">
    <div class="log-header">
      <h2 class="log-title">Today's log</h2>
      <div class="legend">
        <span><i style="background:#FF3B30"></i>&lt;10</span>
        <span><i style="background:#FF9F0A"></i>10–20</span>
        <span><i style="background:#34C759"></i>20–35</span>
        <span><i style="background:#009955"></i>&gt;35</span>
      </div>
    </div>
    <div id="logList"></div>
  </section>

  <section class="card" id="photosCard" style="display:none">
    <h2 class="photos-title">Photos</h2>
    <p class="photos-hint">Tap a photo for nutrition insights</p>
    <div class="photo-grid" id="photoGrid"></div>
  </section>

  <div class="overlay" id="overlay"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <h2 class="sheet-title" id="sheetTitle">Add meal</h2>
    <div class="field">
      <label for="fName">Name</label>
      <input id="fName" type="text" placeholder="e.g. Chicken bowl" autocomplete="off">
    </div>
    <div class="field-row">
      <div class="field">
        <label for="fGrams">Protein (g)</label>
        <input id="fGrams" type="number" inputmode="decimal" min="0" max="500" step="1" placeholder="0">
      </div>
      <div class="field">
        <label for="fTime">Time</label>
        <input id="fTime" type="time">
      </div>
    </div>
    <div class="section-label">Optional macros</div>
    <div class="field-row">
      <div class="field">
        <label for="fKcal">Calories</label>
        <input id="fKcal" type="number" inputmode="numeric" min="0" placeholder="—">
      </div>
      <div class="field">
        <label for="fCarbs">Carbs (g)</label>
        <input id="fCarbs" type="number" inputmode="decimal" min="0" placeholder="—">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="fFat">Fat (g)</label>
        <input id="fFat" type="number" inputmode="decimal" min="0" placeholder="—">
      </div>
      <div class="field">
        <label for="fFiber">Fiber (g)</label>
        <input id="fFiber" type="number" inputmode="decimal" min="0" placeholder="—">
      </div>
    </div>
    <div class="field">
      <label>Photo</label>
      <div class="photo-pick">
        <img class="photo-preview" id="photoPreview" alt="">
        <button type="button" class="pick-btn" id="pickPhoto">Choose photo</button>
      </div>
    </div>
    <div class="sheet-actions">
      <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
      <button type="button" class="btn btn-primary" id="saveBtn">Save</button>
    </div>
    <div class="sheet-actions" id="editExtra" style="display:none;margin-top:10px">
      <button type="button" class="btn btn-danger" id="deleteBtn">Delete</button>
    </div>
  </div>

  <input type="file" id="fileInput" accept="image/*" capture="environment">
  <input type="file" id="importInput" accept="application/json,.json">

        if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { resolve(null); };
    });
  }
  function idbGet(id) {
    return openIdb().then(function (db) {
      if (!db) return null;
      return new Promise(function (resolve) {
        try {
          const tx = db.transaction(IDB_STORE, 'readonly');
          const req = tx.objectStore(IDB_STORE).get(id);
          req.onsuccess = function () { resolve(req.result || null); };
          req.onerror = function () { resolve(null); };
        } catch (e) { resolve(null); }
      });
    });
  }
  function idbSet(id, dataUrl) {
    return openIdb().then(function (db) {
      if (!db) return false;
      return new Promise(function (resolve) {
        try {
          const tx = db.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).put(dataUrl, id);
          tx.oncomplete = function () { resolve(true); };
          tx.onerror = function () { resolve(false); };
        } catch (e) { resolve(false); }
      });
    });
  }
  function idbDel(id) {
    return openIdb().then(function (db) {
      if (!db) return;
      try {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).delete(id);
      } catch (e) {}
    });
  }

  function stripPhoto(entry) {
    const e = Object.assign({}, entry);
    delete e.photo;
    return e;
  }

  function persistMeta() {
    try {
      const clean = {
        schema: SCHEMA,
        goal: state.goal || GOAL,
        entries: state.entries.map(stripPhoto)
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(clean));
      try { localStorage.removeItem(LEGACY_KEY); } catch (e) {}
    } catch (e) {
      console.warn('meta persist failed', e);
    }
  }

  function mergeSeedInto(entries) {
    const byId = {};
    entries.forEach(function (e) { byId[e.id] = e; });
    SEED.forEach(function (seed) {
      const cur = byId[seed.id];
      if (!cur) {
        byId[seed.id] = Object.assign({}, seed);
        return;
      }
      // bump missing nutrition / insights from seed; never overwrite user edits to name/protein if present
      ['kcal', 'carbs_g', 'fat_g', 'fiber_g', 'insights', 'estimates'].forEach(function (k) {
        if (cur[k] == null || cur[k] === '' || (k === 'insights' && (!cur[k] || !cur[k].length))) {
          cur[k] = seed[k];
        }
      });
      // keep seed date/time/name/protein if somehow wiped
      if (!cur.name) cur.name = seed.name;
      if (cur.protein_g == null) cur.protein_g = seed.protein_g;
      if (!cur.date) cur.date = seed.date;
      if (!cur.time) cur.time = seed.time;
      delete cur.photo; // photos never live in meta
    });
    return Object.keys(byId).map(function (k) { return byId[k]; });
  }

  function loadMeta() {
    let data = null;
    try {
      const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_KEY);
      if (raw) data = JSON.parse(raw);
    } catch (e) {}

    if (data && Array.isArray(data.entries) && data.entries.length) {
      // Migrate: drop any embedded photo blobs from legacy v1
      const migrated = data.entries.map(function (e) {
        const copy = Object.assign({}, e);
        // If legacy had inline photo and it's a seed id, drop it (use SEED_PHOTOS)
        // If legacy had inline photo for a user entry, we'll try to move to IDB below
        return copy;
      });
      state = {
        schema: SCHEMA,
        goal: data.goal || GOAL,
        entries: mergeSeedInto(migrated)
      };
      // Fire-and-forget: migrate non-seed inline photos to IDB
      migrated.forEach(function (e) {
        if (e.photo && !SEED_PHOTOS[e.id]) {
          idbSet(e.id, e.photo).then(function () {
            photoCache[e.id] = e.photo;
          });
        }
        delete e.photo;
      });
      state.entries = state.entries.map(stripPhoto);
      persistMeta();
      return;
    }

    state = { schema: SCHEMA, goal: GOAL, entries: SEED.map(function (e) { return Object.assign({}, e); }) };
    persistMeta();
  }

  function resolvePhoto(entry) {
    if (!entry) return Promise.resolve(null);
    if (photoCache[entry.id]) return Promise.resolve(photoCache[entry.id]);
    if (SEED_PHOTOS[entry.id]) {
      photoCache[entry.id] = SEED_PHOTOS[entry.id];
      return Promise.resolve(SEED_PHOTOS[entry.id]);
    }
    return idbGet(entry.id).then(function (url) {
      if (url) photoCache[entry.id] = url;
      return url;
    });
  }

  function entriesFor(date) {
    return state.entries
      .filter(function (e) { return e.date === date; })
      .sort(function (a, b) {
        return (a.time || '').localeCompare(b.time || '') || String(a.id).localeCompare(String(b.id));
      });
  }
  function dayTotal(date) {
    return entriesFor(date).reduce(function (s, e) { return s + (Number(e.protein_g) || 0); }, 0);
  }
  function dayBand(g) {
    if (g >= 120) return 'green';
    if (g >= 90) return 'amber';
    if (g > 0) return 'red';
    return null;
  }
  function dayColor(g) {
    const b = dayBand(g);
    return b ? COLORS[b] : null;
  }
  function mealBand(g) {
    if (g > 35) return 'sgreen';
    if (g >= 20) return 'green';
    if (g >= 10) return 'amber';
    return 'red';
  }
  function mealColor(g) { return COLORS[mealBand(g)]; }
  function statusInfo(g) {
    if (g >= 120) return { label: 'Great', color: COLORS.green };
    if (g >= 90) return { label: 'Fair', color: COLORS.amber };
    return { label: 'Low', color: COLORS.red };
  }
  function hintText(g) {
    if (g >= GOAL) return 'Goal hit';
    if (g >= 120) return (GOAL - g) + 'g to goal';
    if (g >= 90) return (120 - g) + 'g to green';
    if (g > 0) return (90 - g) + 'g to amber';
    return 'Log a meal to start';
  }

  function polar(cx, cy, r, deg) {
    const rad = (deg * Math.PI) / 180;
    return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
  }
  const START = 150, SWEEP = 240;
  function valueToAngle(v) {
    return START + SWEEP * (Math.max(0, Math.min(MAX_G, v)) / MAX_G);
  }
  function describeArc(cx, cy, r, a0, a1) {
    const s = polar(cx, cy, r, a0), e = polar(cx, cy, r, a1);
    const large = (a1 - a0) > 180 ? 1 : 0;
    return 'M ' + s.x + ' ' + s.y + ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + e.x + ' ' + e.y;
  }

  function drawGauge(total) {
    const svg = document.getElementById('gaugeSvg');
    const cx = 160, cy = 155, r = 108, stroke = 18, gap = 3;
    const bands = [
      { from: 0, to: 90, color: COLORS.red },
      { from: 90, to: 120, color: COLORS.amber },
      { from: 120, to: 200, color: COLORS.green }
    ];
    let html = '<path d="' + describeArc(cx, cy, r, START, START + SWEEP) + '" fill="none" stroke="#E5E5EA" stroke-width="' + stroke + '" stroke-linecap="round"/>';
    bands.forEach(function (b, i) {
      let a0 = valueToAngle(b.from), a1 = valueToAngle(b.to);
      if (i > 0) a0 += gap / 2;
      if (i < bands.length - 1) a1 -= gap / 2;
      if (a1 <= a0) return;
      html += '<path d="' + describeArc(cx, cy, r, a0, a1) + '" fill="none" stroke="' + b.color + '" stroke-width="' + stroke + '" stroke-linecap="round"/>';
    });
    function labelAt(v, text, dy) {
      const p = polar(cx, cy, r + 28, valueToAngle(v));
      return '<text class="band-label" x="' + p.x + '" y="' + (p.y + (dy || 0)) + '" text-anchor="middle" dominant-baseline="middle">' + text + '</text>';
    }
    html += labelAt(0, '0', 4) + labelAt(90, '90') + labelAt(120, '120') + labelAt(200, '200', 4);
    const ga = valueToAngle(GOAL);
    const gin = polar(cx, cy, r - stroke / 2 - 4, ga);
    const gout = polar(cx, cy, r + stroke / 2 + 4, ga);
    html += '<line x1="' + gin.x + '" y1="' + gin.y + '" x2="' + gout.x + '" y2="' + gout.y + '" stroke="#1C1C1E" stroke-width="2" stroke-linecap="round"/>';
    const gl = polar(cx, cy, r + 42, ga);
    html += '<text class="band-label" x="' + gl.x + '" y="' + gl.y + '" text-anchor="middle" dominant-baseline="middle" style="fill:#1C1C1E;font-weight:700">Goal 155</text>';
    const mp = polar(cx, cy, r, valueToAngle(total));
    const mc = dayColor(total) || COLORS.red;
    html += '<circle cx="' + mp.x + '" cy="' + mp.y + '" r="11" fill="#fff" stroke="' + mc + '" stroke-width="4"><animate attributeName="r" from="0" to="11" dur="0.45s" fill="freeze"/></circle>';
    svg.innerHTML = html;
    document.getElementById('totalNum').textContent = Math.round(total);
    const st = statusInfo(total);
    const pill = document.getElementById('statusPill');
    pill.textContent = st.label;
    pill.style.background = st.color;
    document.getElementById('gaugeHint').textContent = hintText(total);
  }

  function mondayOf(dateStr) {
    const d = parseYmd(dateStr);
    const day = d.getDay();
    d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
    return ymd(d);
  }

  function renderWeek() {
    const mon = mondayOf(viewDate);
    const initials = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
    const today = todayStr();
    let html = '';
    for (let i = 0; i < 7; i++) {
      const ds = addDays(mon, i);
      const total = dayTotal(ds);
      const color = dayColor(total);
      let cls = 'week-dot', style = '';
      if (!(ds > today) && total > 0 && color) {
        cls += ' filled';
        style = 'background:' + color + ';border-color:' + color;
      }
      if (ds === viewDate) cls += ' viewed';
      html += '<div class="week-day"><div class="' + cls + '" style="' + style + '"></div><div class="week-initial">' + initials[i] + '</div></div>';
    }
    document.getElementById('weekRow').innerHTML = html;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  function renderLog() {
    const list = document.getElementById('logList');
    const entries = entriesFor(viewDate);
    if (!entries.length) {
      list.innerHTML = '<div class="empty">No meals logged</div>';
      return;
    }
    list.innerHTML = entries.map(function (e) {
      const g = Number(e.protein_g) || 0;
      const c = mealColor(g);
      const pct = Math.min(100, (g / 60) * 100);
      const power = g > 35 ? '<span class="power-pill">POWER MEAL</span>' : '';
      return '<div class="log-row" data-id="' + escapeHtml(e.id) + '">' +
        '<div class="log-dot" style="background:' + c + '"></div>' +
        '<div class="log-main"><div class="log-name">' + escapeHtml(e.name) + ' ' + power + '</div>' +
        '<div class="log-time">' + escapeHtml(e.time || '') + '</div></div>' +
        '<div class="log-bar-wrap"><div class="log-bar" style="width:' + pct + '%;background:' + c + '"></div></div>' +
        '<div class="log-grams" style="color:' + c + '">' + Math.round(g) + '</div></div>';
    }).join('');
    list.querySelectorAll('.log-row').forEach(function (row) {
      row.addEventListener('click', function () { openEdit(row.dataset.id); });
    });
  }

  function hasDetails(e) {
    return e.kcal != null || e.carbs_g != null || e.fat_g != null || e.fiber_g != null;
  }

  function buildBackHtml(e) {
    const g = Number(e.protein_g) || 0;
    const est = e.estimates ? '<p class="back-sub">~ estimates</p>' : '';
    let body = '<h3 class="back-title">' + escapeHtml(e.name) + '</h3>' + est;

    if (!hasDetails(e)) {
      body += '<div class="stat-grid"><div class="stat-tile"><div class="v">' + Math.round(g) + 'g</div><div class="l">Protein</div></div></div>';
      body += '<p class="back-empty">Add details to see more</p>';
      return body;
    }

    const kcal = e.kcal != null ? Math.round(e.kcal) : '—';
    const carbs = e.carbs_g != null ? Number(e.carbs_g) : 0;
    const fat = e.fat_g != null ? Number(e.fat_g) : 0;
    const fiber = e.fiber_g != null ? Number(e.fiber_g) : null;
    const pKcal = g * 4, cKcal = carbs * 4, fKcal = fat * 9;
    const sum = pKcal + cKcal + fKcal || 1;
    const pPct = Math.round((pKcal / sum) * 100);
    const cPct = Math.round((cKcal / sum) * 100);
    const fPct = Math.max(0, 100 - pPct - cPct);

    body += '<div class="stat-grid">';
    body += '<div class="stat-tile"><div class="v">' + kcal + '</div><div class="l">kcal</div></div>';
    body += '<div class="stat-tile"><div class="v">' + Math.round(g) + 'g</div><div class="l">Protein</div></div>';
    body += '</div>';
    body += '<div class="stat-grid" style="grid-template-columns:1fr 1fr 1fr">';
    body += '<div class="stat-tile"><div class="v">' + (e.carbs_g != null ? Math.round(carbs) + 'g' : '—') + '</div><div class="l">Carbs</div></div>';
    body += '<div class="stat-tile"><div class="v">' + (e.fat_g != null ? Math.round(fat) + 'g' : '—') + '</div><div class="l">Fat</div></div>';
    body += '<div class="stat-tile"><div class="v">' + (fiber != null ? Math.round(fiber) + 'g' : '—') + '</div><div class="l">Fiber</div></div>';
    body += '</div>';

    body += '<div class="macro-bar">';
    body += '<span style="width:' + pPct + '%;background:' + COLORS.green + '"></span>';
    body += '<span style="width:' + cPct + '%;background:' + COLORS.amber + '"></span>';
    body += '<span style="width:' + fPct + '%;background:' + COLORS.red + '"></span>';
    body += '</div>';
    body += '<div class="macro-legend"><span><i style="background:' + COLORS.green + '"></i>P ' + pPct + '%</span>';
    body += '<span><i style="background:' + COLORS.amber + '"></i>C ' + cPct + '%</span>';
    body += '<span><i style="background:' + COLORS.red + '"></i>F ' + fPct + '%</span></div>';

    (e.insights || []).slice(0, 2).forEach(function (line) {
      body += '<div class="insight">' + escapeHtml(line) + '</div>';
    });
    return body;
  }

  function renderPhotos() {
    const card = document.getElementById('photosCard');
    const grid = document.getElementById('photoGrid');
    const entries = entriesFor(viewDate);

    // Resolve photos for all entries, then show those that have one
    Promise.all(entries.map(function (e) {
      return resolvePhoto(e).then(function (url) { return { e: e, url: url }; });
    })).then(function (rows) {
      const withPhoto = rows.filter(function (r) { return !!r.url; });
      if (!withPhoto.length) {
        card.style.display = 'none';
        grid.innerHTML = '';
        return;
      }
      card.style.display = 'block';
      grid.innerHTML = withPhoto.map(function (r) {
        const e = r.e;
        const g = Number(e.protein_g) || 0;
        const c = mealColor(g);
        const isFlipped = !!flipped[e.id];
        return '<div class="flip-scene" data-id="' + escapeHtml(e.id) + '" role="button" aria-label="Flip meal card">' +
          '<div class="flip-card' + (isFlipped ? ' flipped' : '') + '">' +
            '<div class="flip-face flip-front">' +
              '<img src="' + r.url + '" alt="' + escapeHtml(e.name) + '" loading="lazy">' +
              '<div class="flip-hint">Tap</div>' +
              '<div class="photo-cap"><div>' + escapeHtml(e.name) + '</div>' +
              '<div><span class="t">' + escapeHtml(e.time || '') + '</span> · <span class="g" style="color:' + c + '">' + Math.round(g) + 'g</span></div></div>' +
            '</div>' +
            '<div class="flip-face flip-back">' + buildBackHtml(e) + '</div>' +
          '</div></div>';
      }).join('');

      grid.querySelectorAll('.flip-scene').forEach(function (el) {
        el.addEventListener('click', function (ev) {
          ev.stopPropagation();
          const id = el.dataset.id;
          flipped[id] = !flipped[id];
          const cardEl = el.querySelector('.flip-card');
          if (cardEl) cardEl.classList.toggle('flipped', !!flipped[id]);
        });
      });
    });
  }

  function render() {
    document.getElementById('dateLabel').textContent = formatDateLabel(viewDate);
    const isToday = viewDate === todayStr();
    document.querySelector('.gauge-kicker').textContent = isToday ? "Today's protein" : 'Day total';
    document.querySelector('.log-title').textContent = isToday ? "Today's log" : 'Day log';
    drawGauge(dayTotal(viewDate));
    renderWeek();
    renderLog();
    renderPhotos();
  }

  function openSheet() {
    document.getElementById('overlay').classList.add('open');
    document.getElementById('sheet').classList.add('open');
  }
  function closeSheet() {
    document.getElementById('overlay').classList.remove('open');
    document.getElementById('sheet').classList.remove('open');
    editingId = null;
    pendingPhoto = null;
    document.getElementById('editExtra').style.display = 'none';
    document.getElementById('photoPreview').classList.remove('show');
    document.getElementById('photoPreview').removeAttribute('src');
  }
  function numOrNull(id) {
    const v = document.getElementById(id).value;
    if (v === '' || v == null) return null;
    const n = parseFloat(v);
    return isNaN(n) ? null : n;
  }

  function openAdd() {
    editingId = null;
    pendingPhoto = null;
    document.getElementById('sheetTitle').textContent = 'Add meal';
    ['fName','fGrams','fKcal','fCarbs','fFat','fFiber'].forEach(function (id) { document.getElementById(id).value = ''; });
    document.getElementById('fTime').value = nowTime();
    document.getElementById('editExtra').style.display = 'none';
    document.getElementById('photoPreview').classList.remove('show');
    openSheet();
    setTimeout(function () { document.getElementById('fName').focus(); }, 280);
  }

  function openEdit(id) {
    const e = state.entries.find(function (x) { return x.id === id; });
    if (!e) return;
    editingId = id;
    pendingPhoto = null;
    document.getElementById('sheetTitle').textContent = 'Edit meal';
    document.getElementById('fName').value = e.name || '';
    document.getElementById('fGrams').value = e.protein_g;
    document.getElementById('fTime').value = e.time || nowTime();
    document.getElementById('fKcal').value = e.kcal != null ? e.kcal : '';
    document.getElementById('fCarbs').value = e.carbs_g != null ? e.carbs_g : '';
    document.getElementById('fFat').value = e.fat_g != null ? e.fat_g : '';
    document.getElementById('fFiber').value = e.fiber_g != null ? e.fiber_g : '';
    document.getElementById('editExtra').style.display = 'flex';
    const prev = document.getElementById('photoPreview');
    resolvePhoto(e).then(function (url) {
      if (url) { prev.src = url; prev.classList.add('show'); }
      else { prev.classList.remove('show'); prev.removeAttribute('src'); }
    });
    openSheet();
  }

  function saveEntry() {
    const name = document.getElementById('fName').value.trim();
    const grams = parseFloat(document.getElementById('fGrams').value);
    const time = document.getElementById('fTime').value || nowTime();
    if (!name || isNaN(grams) || grams < 0) {
      alert('Enter a name and protein grams.');
      return;
    }
    const macros = {
      kcal: numOrNull('fKcal'),
      carbs_g: numOrNull('fCarbs'),
      fat_g: numOrNull('fFat'),
      fiber_g: numOrNull('fFiber')
    };

    function finish(id) {
      if (pendingPhoto) {
        photoCache[id] = pendingPhoto;
        idbSet(id, pendingPhoto);
      }
      persistMeta();
      closeSheet();
      render();
    }

    if (editingId) {
      const idx = state.entries.findIndex(function (x) { return x.id === editingId; });
      if (idx >= 0) {
        state.entries[idx] = Object.assign({}, state.entries[idx], {
          name: name, protein_g: grams, time: time
        }, macros);
        // user edited macros → no longer pure seed estimates
        if (macros.kcal != null || macros.carbs_g != null) state.entries[idx].estimates = false;
        finish(editingId);
      }
    } else {
      const id = uid();
      state.entries.push(Object.assign({
        id: id, date: viewDate, time: time, name: name, protein_g: grams, insights: []
      }, macros));
      finish(id);
    }
  }

  function deleteEntry() {
    if (!editingId) return;
    if (!confirm('Delete this meal?')) return;
    const id = editingId;
    state.entries = state.entries.filter(function (x) { return x.id !== id; });
    delete photoCache[id];
    delete flipped[id];
    if (!SEED_PHOTOS[id]) idbDel(id);
    persistMeta();
    closeSheet();
    render();
  }

  function compressImage(file) {
    return new Promise(function (resolve, reject) {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = function () {
        const img = new Image();
        img.onload = function () {
          const max = 600;
          let w = img.width, h = img.height;
          const scale = Math.min(1, max / Math.max(w, h));
          w = Math.round(w * scale); h = Math.round(h * scale);
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.7));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  document.getElementById('addBtn').addEventListener('click', openAdd);
  document.getElementById('cancelBtn').addEventListener('click', closeSheet);
  document.getElementById('overlay').addEventListener('click', closeSheet);
  document.getElementById('saveBtn').addEventListener('click', saveEntry);
  document.getElementById('deleteBtn').addEventListener('click', deleteEntry);
  document.getElementById('prevDay').addEventListener('click', function () { viewDate = addDays(viewDate, -1); flipped = {}; render(); });
  document.getElementById('nextDay').addEventListener('click', function () { viewDate = addDays(viewDate, 1); flipped = {}; render(); });

  const menuBtn = document.getElementById('menuBtn');
  const menu = document.getElementById('menu');
  menuBtn.addEventListener('click', function (e) { e.stopPropagation(); menu.classList.toggle('open'); });
  document.addEventListener('click', function () { menu.classList.remove('open'); });
  menu.addEventListener('click', function (e) { e.stopPropagation(); });

  document.getElementById('exportBtn').addEventListener('click', function () {
    menu.classList.remove('open');
    const blob = new Blob([JSON.stringify({ schema: SCHEMA, goal: state.goal, entries: state.entries.map(stripPhoto) }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'protein-tracker-' + todayStr() + '.json';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });
  document.getElementById('importBtn').addEventListener('click', function () {
    menu.classList.remove('open');
    document.getElementById('importInput').click();
  });
  document.getElementById('importInput').addEventListener('change', function (ev) {
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if (!file) return;
    file.text().then(function (text) {
      const data = JSON.parse(text);
      if (!data || !Array.isArray(data.entries)) throw new Error('bad');
      if (!confirm('Replace all data with this import?')) return;
      state = { schema: SCHEMA, goal: data.goal || GOAL, entries: mergeSeedInto(data.entries.map(stripPhoto)) };
      persistMeta();
      render();
    }).catch(function () { alert('Could not import that JSON file.'); });
  });
  document.getElementById('clearDayBtn').addEventListener('click', function () {
    menu.classList.remove('open');
    if (!confirm('Clear all meals on ' + formatDateLabel(viewDate) + '?')) return;
    const removed = state.entries.filter(function (e) { return e.date === viewDate; });
    state.entries = state.entries.filter(function (e) { return e.date !== viewDate; });
    removed.forEach(function (e) {
      delete photoCache[e.id];
      if (!SEED_PHOTOS[e.id]) idbDel(e.id);
    });
    persistMeta();
    render();
  });

  document.getElementById('pickPhoto').addEventListener('click', function () {
    document.getElementById('fileInput').click();
  });
  document.getElementById('fileInput').addEventListener('change', function (ev) {
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if (!file) return;
    compressImage(file).then(function (dataUrl) {
      pendingPhoto = dataUrl;
      const prev = document.getElementById('photoPreview');
      prev.src = pendingPhoto;
      prev.classList.add('show');
    }).catch(function () { alert('Could not read that photo.'); });
  });

  // Test hook for headless verification
  window.__proteinTest = {
    flip: function (id) { flipped[id] = true; renderPhotos(); },
    getPhotoCount: function () {
      return Promise.all(entriesFor(viewDate).map(resolvePhoto)).then(function (urls) {
        return urls.filter(Boolean).length;
      });
    },
    dayTotal: function () { return dayTotal(viewDate); }
  };

  loadMeta();
  if (dayTotal(viewDate) === 0 && dayTotal('2026-11-09') > 0) viewDate = '2026-11-09';
  render();
})();
</script>
</body>
</html>
